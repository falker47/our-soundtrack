name: Catalog, behavior and distribution validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax checks
        run: |
          node --check soundtrack-catalog.js
          node --check player-core.js
          node --check offline-client.js
          node --check script.js
          node --check service-worker-core.js
          node --check service-worker.js

      - name: Behavior tests
        run: node --test tests/*.test.mjs

      - name: Validate catalog, architecture and scoped PWA paths
        run: node scripts/validate-catalog.mjs

      - name: Validate media distribution boundary
        run: node scripts/validate-media-distribution.mjs
